# Pre-commit gates — mirror the CI checks so problems are caught before push.
# Install:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: local
    hooks:
      - id: oscal-schema
        name: OSCAL schema + completeness
        entry: python scripts/validate_oscal.py
        language: system
        files: ^oscal/.*\.json$
        pass_filenames: false
      - id: ssp-completeness
        name: SSP completeness (110 practices)
        entry: python scripts/status_report.py --check
        language: system
        files: ^oscal/ssp/.*\.json$
        pass_filenames: false
