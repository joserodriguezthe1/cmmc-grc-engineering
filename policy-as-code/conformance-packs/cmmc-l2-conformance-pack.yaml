# =============================================================================
# AWS Config Conformance Pack — CMMC L2 continuous monitoring
# Implements continuous detection for: CA.L2-3.12.3, CM.L2-3.4.1/3.4.2,
# AC.L2-3.1.22, IA.L2-3.5.x, SC.L2-3.13.16, AU.L2-3.3.1
#
# COST: AWS Config is NOT free (charges per config item + rule evaluation).
# Deploy deliberately; see docs/architecture/free-tier-cost-notes.md.
#
# Deploy: bash policy-as-code/deploy-conformance-pack.sh
# =============================================================================
Resources:

  # --- AC.L2-3.1.22 : no public CUI ---
  S3BucketPublicReadProhibited:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-s3-bucket-public-read-prohibited
      Description: "AC.L2-3.1.22 - S3 buckets must not allow public read"
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED

  S3BucketPublicWriteProhibited:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-s3-bucket-public-write-prohibited
      Description: "AC.L2-3.1.22 - S3 buckets must not allow public write"
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED

  # --- SC.L2-3.13.16 / MP.L2-3.8.1 : encryption at rest ---
  S3DefaultEncryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-s3-default-encryption-kms
      Description: "SC.L2-3.13.16 - S3 buckets must enforce KMS encryption"
      Source:
        Owner: AWS
        SourceIdentifier: S3_DEFAULT_ENCRYPTION_KMS

  EncryptedVolumes:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-ebs-encrypted-volumes
      Description: "SC.L2-3.13.16 - EBS volumes must be encrypted"
      Source:
        Owner: AWS
        SourceIdentifier: ENCRYPTED_VOLUMES

  # --- SC.L2-3.13.8 : encryption in transit ---
  S3BucketSSLRequestsOnly:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-s3-ssl-requests-only
      Description: "SC.L2-3.13.8 - S3 must require TLS"
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_SSL_REQUESTS_ONLY

  # --- IA.L2-3.5.3 : MFA ---
  IAMUserMFAEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-iam-user-mfa-enabled
      Description: "IA.L2-3.5.3 - IAM users must have MFA"
      Source:
        Owner: AWS
        SourceIdentifier: IAM_USER_MFA_ENABLED

  RootAccountMFAEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-root-account-mfa-enabled
      Description: "IA.L2-3.5.3 - Root account must have MFA"
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_MFA_ENABLED

  # --- IA.L2-3.5.7/3.5.8 : password policy ---
  IAMPasswordPolicy:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-iam-password-policy
      Description: "IA.L2-3.5.7/3.5.8 - Strong account password policy"
      Source:
        Owner: AWS
        SourceIdentifier: IAM_PASSWORD_POLICY
      InputParameters:
        RequireUppercaseCharacters: "true"
        RequireLowercaseCharacters: "true"
        RequireSymbols: "true"
        RequireNumbers: "true"
        MinimumPasswordLength: "14"
        PasswordReusePrevention: "24"
        MaxPasswordAge: "90"

  # --- AC.L2-3.1.5 : least privilege ---
  IAMUserNoPoliciesCheck:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-iam-user-no-inline-policies
      Description: "AC.L2-3.1.5 - Policies attached to groups/roles, not users"
      Source:
        Owner: AWS
        SourceIdentifier: IAM_USER_NO_POLICIES_CHECK

  AccessKeysRotated:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-access-keys-rotated
      Description: "IA.L2-3.5.x - Access keys rotated within 90 days"
      Source:
        Owner: AWS
        SourceIdentifier: ACCESS_KEYS_ROTATED
      InputParameters:
        maxAccessKeyAge: "90"

  # --- AU.L2-3.3.1 : audit logging enabled ---
  CloudTrailEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-cloudtrail-enabled
      Description: "AU.L2-3.3.1 - CloudTrail must be enabled"
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENABLED

  CloudTrailEncryption:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-cloudtrail-encryption
      Description: "AU.L2-3.3.8 - CloudTrail logs encrypted with KMS"
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENCRYPTION_ENABLED

  CloudTrailLogValidation:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-cloudtrail-log-validation
      Description: "AU.L2-3.3.8 - CloudTrail log file validation enabled"
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_LOG_FILE_VALIDATION_ENABLED

  # --- SI.L2-3.14.6 : monitoring ---
  VPCFlowLogsEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-vpc-flow-logs-enabled
      Description: "SI.L2-3.14.6 - VPC flow logs must be enabled"
      Source:
        Owner: AWS
        SourceIdentifier: VPC_FLOW_LOGS_ENABLED

  # --- SC.L2-3.13.6 : restrict open ports ---
  RestrictedSSH:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-restricted-ssh
      Description: "SC.L2-3.13.6 - No unrestricted inbound SSH"
      Source:
        Owner: AWS
        SourceIdentifier: INCOMING_SSH_DISABLED

  RestrictedCommonPorts:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cmmc-restricted-common-ports
      Description: "SC.L2-3.13.6 - No unrestricted access to common ports"
      Source:
        Owner: AWS
        SourceIdentifier: RESTRICTED_INCOMING_TRAFFIC
      InputParameters:
        blockedPort1: "22"
        blockedPort2: "3389"
